services:
  app:
    build: .
    environment:
      APP_MESSAGE: "Hello from the Node.js API container!"
    volumes:
      - app_data:/data
    expose:
      - "3000"
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8084:80"
    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
